# SPDX-License-Identifier: AGPL-3.0-only
# Builds RPlay K&M on every push and pull request, runs the tests and uploads the programs.
# Pushing a tag like v0.1.0 also publishes a release with a ready-to-run zip.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # only used to publish a release on tags
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $out = "RPlayKM"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/Release/rplaykm.exe, build/Release/rplayctl.exe, build/Release/inputcheck.exe $out
          Copy-Item LICENSE, README.md $out
          Copy-Item docs/gta6-controls.md $out
          Compress-Archive -Path $out -DestinationPath RPlayKM-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RPlayKM-windows-x64
          path: RPlayKM-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RPlayKM-windows-x64.zip
          generate_release_notes: true
